<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Your Experience - Jayem Visuals Photography</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #0d0d0d;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .rating-container {
            background: rgba(30, 30, 30, 0.9);
            padding: 4rem;
            border-radius: 16px;
            border: 1px solid #333;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        .rating-container h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            color: #e63946;
            margin-bottom: 0.5rem;
        }
        .rating-container p {
            color: #8d99ae;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        .stars-display {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 60px;
            margin: 30px 0;
        }
        .stars-display .star {
            cursor: pointer;
            transition: transform 0.3s, color 0.3s;
            color: #333;
            text-decoration: none;
            display: inline-block;
        }
        .stars-display .star:hover {
            transform: scale(1.3);
            color: #ffd700;
        }
        .stars-display .star.selected {
            color: #ffd700;
        }
        .stars-display .star.selected:hover {
            transform: scale(1.3);
        }
        .rating-message {
            background: rgba(230, 57, 70, 0.1);
            border: 1px solid #e63946;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            display: none;
        }
        .rating-message.show {
            display: block;
        }
        .rating-message.success {
            border-color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
        }
        .btn-back {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: #e63946;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            margin-top: 1rem;
        }
        .btn-back:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(230, 57, 70, 0.3);
        }
        .selected-rating {
            font-size: 2rem;
            color: #ffd700;
            margin: 10px 0;
        }
        .feedback-textarea {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            resize: vertical;
            min-height: 100px;
            margin: 15px 0;
            font-family: 'Montserrat', sans-serif;
        }
        .feedback-textarea:focus {
            border-color: #e63946;
            outline: none;
        }
        .btn-submit {
            padding: 0.8rem 2rem;
            background: #4caf50;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.3);
        }
    </style>
</head>
<body>
    <div class="rating-container">
        <h1>⭐ Rate Us</h1>
        <p>How was your experience with Jayem Visuals Photography?</p>

        <div class="stars-display" id="starsDisplay">
            <a href="#" class="star" data-rating="1">⭐</a>
            <a href="#" class="star" data-rating="2">⭐</a>
            <a href="#" class="star" data-rating="3">⭐</a>
            <a href="#" class="star" data-rating="4">⭐</a>
            <a href="#" class="star" data-rating="5">⭐</a>
        </div>

        <div id="selectedRating" class="selected-rating"></div>

        <textarea id="feedbackText" class="feedback-textarea" placeholder="Tell us about your experience... (optional)"></textarea>

        <button id="submitRating" class="btn-submit">Submit Rating</button>

        <div id="ratingMessage" class="rating-message"></div>

        <a href="index.html" class="btn-back">Back to Website</a>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        let selectedRating = 0;
        let ratingToken = '';

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        ratingToken = urlParams.get('token') || '';
        const urlRating = parseInt(urlParams.get('rating'));

        // If rating came from URL (email link), pre-select it
        if (urlRating >= 1 && urlRating <= 5) {
            selectedRating = urlRating;
            updateStarsDisplay(selectedRating);
            document.getElementById('selectedRating').textContent = '⭐'.repeat(selectedRating) + ' (' + selectedRating + '/5)';
        }

        // Star click handlers
        document.querySelectorAll('.star').forEach(star => {
            star.addEventListener('click', function(e) {
                e.preventDefault();
                const rating = parseInt(this.dataset.rating);
                selectedRating = rating;
                updateStarsDisplay(rating);
                document.getElementById('selectedRating').textContent = '⭐'.repeat(rating) + ' (' + rating + '/5)';
            });
        });

        function updateStarsDisplay(rating) {
            document.querySelectorAll('.star').forEach(star => {
                const starRating = parseInt(star.dataset.rating);
                if (starRating <= rating) {
                    star.classList.add('selected');
                } else {
                    star.classList.remove('selected');
                }
            });
        }

        // Submit rating
        document.getElementById('submitRating').addEventListener('click', async function() {
            const messageEl = document.getElementById('ratingMessage');
            const feedback = document.getElementById('feedbackText').value;

            if (selectedRating === 0) {
                messageEl.className = 'rating-message show';
                messageEl.style.borderColor = '#f44336';
                messageEl.style.background = 'rgba(244, 67, 54, 0.1)';
                messageEl.innerHTML = '⚠️ Please select a rating before submitting.';
                return;
            }

            try {
                const response = await fetch(API_URL + '/testimonials', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: 'Valued Client',
                        email: 'client@example.com',
                        content: feedback || 'Great experience! ⭐⭐⭐⭐⭐',
                        rating: selectedRating,
                        service: 'Photography'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    messageEl.className = 'rating-message show success';
                    messageEl.innerHTML = '✅ Thank you for your rating! Your feedback helps us improve. 🌟';
                    document.getElementById('submitRating').disabled = true;
                    document.getElementById('submitRating').style.opacity = '0.5';
                } else {
                    messageEl.className = 'rating-message show';
                    messageEl.style.borderColor = '#f44336';
                    messageEl.style.background = 'rgba(244, 67, 54, 0.1)';
                    messageEl.innerHTML = '❌ Something went wrong. Please try again.';
                }
            } catch (error) {
                console.error('Rating error:', error);
                messageEl.className = 'rating-message show';
                messageEl.style.borderColor = '#f44336';
                messageEl.style.background = 'rgba(244, 67, 54, 0.1)';
                messageEl.innerHTML = '❌ Could not connect to server. Please try again later.';
            }
        });
    </script>
</body>
</html>
