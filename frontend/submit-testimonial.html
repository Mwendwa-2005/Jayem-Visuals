<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Testimonial - Jayem Visuals Photography</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #0d0d0d;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(30, 30, 30, 0.9);
            padding: 3rem;
            border-radius: 16px;
            border: 1px solid #333;
        }

        .container h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            color: #e63946;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .container .subtitle {
            text-align: center;
            color: #8d99ae;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: #f1faee;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s;
            font-family: 'Montserrat', sans-serif;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #e63946;
            outline: none;
            box-shadow: 0 0 15px rgba(230, 57, 70, 0.1);
        }

        .form-group select option {
            background: #1a1a1a;
            color: #fff;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-group .star-rating {
            display: flex;
            gap: 10px;
            font-size: 35px;
            cursor: pointer;
            justify-content: center;
            padding: 10px 0;
        }

        .form-group .star-rating .star {
            color: #333;
            transition: all 0.3s;
            user-select: none;
        }

        .form-group .star-rating .star:hover,
        .form-group .star-rating .star.active {
            color: #ffd700;
            transform: scale(1.2);
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: #e63946;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(230, 57, 70, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-back {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #8d99ae;
            text-decoration: none;
            transition: color 0.3s;
        }

        .btn-back:hover {
            color: #e63946;
        }

        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            display: none;
        }

        .message.success {
            display: block;
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #4caf50;
        }

        .message.error {
            display: block;
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #f44336;
        }

        .message.info {
            display: block;
            background: rgba(33, 150, 243, 0.2);
            border: 1px solid #2196f3;
            color: #2196f3;
        }

        @media (max-width: 600px) {
            .container {
                padding: 1.5rem;
            }

            .container h1 {
                font-size: 2rem;
            }

            .form-group .star-rating {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⭐ Share Your Experience</h1>
        <p class="subtitle">Help others by sharing your experience with Jayem Visuals Photography</p>

        <form id="testimonialForm">
            <div class="form-group">
                <label for="testimonialName">Your Name *</label>
                <input type="text" id="testimonialName" placeholder="e.g., John Doe" required>
            </div>

            <div class="form-group">
                <label for="testimonialEmail">Your Email *</label>
                <input type="email" id="testimonialEmail" placeholder="you@email.com" required>
            </div>

            <div class="form-group">
                <label for="testimonialService">Service Used *</label>
                <select id="testimonialService" required>
                    <option value="">Select a service</option>
                    <option value="wildlife">Wildlife Photography</option>
                    <option value="wedding">Wedding Photography</option>
                    <option value="event">Event Photography</option>
                    <option value="studio">Studio Photography</option>
                    <option value="outdoor">Outdoor Photography</option>
                    <option value="indoor">Indoor Photography</option>
                </select>
            </div>

            <div class="form-group">
                <label>Your Rating *</label>
                <div class="star-rating" id="starRating">
                    <span class="star" data-value="1">⭐</span>
                    <span class="star" data-value="2">⭐</span>
                    <span class="star" data-value="3">⭐</span>
                    <span class="star" data-value="4">⭐</span>
                    <span class="star" data-value="5">⭐</span>
                </div>
                <input type="hidden" id="testimonialRating" value="0" required>
                <p id="ratingText" style="text-align:center;color:#8d99ae;font-size:0.9rem;margin-top:0.5rem;">Click a star to rate</p>
            </div>

            <div class="form-group">
                <label for="testimonialContent">Your Testimonial *</label>
                <textarea id="testimonialContent" placeholder="Share your experience with us..." required></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fas fa-paper-plane"></i> Submit Testimonial
            </button>
        </form>

        <div id="message" class="message"></div>

        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Website</a>
    </div>

    <script>
        const API_URL = 'https://jayem-visuals-api.onrender.com/api';

        // ============================================
        // Star Rating System
        // ============================================
        const stars = document.querySelectorAll('.star-rating .star');
        const ratingInput = document.getElementById('testimonialRating');
        const ratingText = document.getElementById('ratingText');

        let selectedRating = 0;

        stars.forEach(star => {
            star.addEventListener('click', function() {
                selectedRating = parseInt(this.dataset.value);
                ratingInput.value = selectedRating;
                
                stars.forEach(s => {
                    const val = parseInt(s.dataset.value);
                    if (val <= selectedRating) {
                        s.classList.add('active');
                    } else {
                        s.classList.remove('active');
                    }
                });

                const ratings = {
                    1: 'Poor',
                    2: 'Fair',
                    3: 'Good',
                    4: 'Very Good',
                    5: 'Excellent'
                };
                ratingText.textContent = ratings[selectedRating] + ' ⭐';
                ratingText.style.color = '#ffd700';
            });

            star.addEventListener('mouseenter', function() {
                const val = parseInt(this.dataset.value);
                stars.forEach(s => {
                    const sVal = parseInt(s.dataset.value);
                    if (sVal <= val) {
                        s.style.color = '#ffd700';
                    } else {
                        s.style.color = '#333';
                    }
                });
            });

            star.addEventListener('mouseleave', function() {
                stars.forEach(s => {
                    const val = parseInt(s.dataset.value);
                    if (val <= selectedRating) {
                        s.style.color = '#ffd700';
                    } else {
                        s.style.color = '#333';
                    }
                });
            });
        });

        // ============================================
        // Form Submission
        // ============================================
        document.getElementById('testimonialForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('testimonialName').value.trim();
            const email = document.getElementById('testimonialEmail').value.trim();
            const service = document.getElementById('testimonialService').value;
            const rating = parseInt(document.getElementById('testimonialRating').value);
            const content = document.getElementById('testimonialContent').value.trim();

            const message = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');

            // Validate
            if (!name || !email || !service || !rating || !content) {
                message.className = 'message error';
                message.textContent = '⚠️ Please fill in all fields and select a rating.';
                return;
            }

            if (rating < 1 || rating > 5) {
                message.className = 'message error';
                message.textContent = '⚠️ Please select a rating (1-5 stars).';
                return;
            }

            // Disable button
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';

            try {
                const response = await fetch(API_URL + '/testimonials', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        service: service,
                        rating: rating,
                        content: content
                    })
                });

                const data = await response.json();

                if (data.success) {
                    message.className = 'message success';
                    message.textContent = '✅ Thank you! Your testimonial has been submitted for approval. It will appear soon.';
                    message.style.display = 'block';
                    document.getElementById('testimonialForm').reset();
                    document.querySelectorAll('.star-rating .star').forEach(s => s.classList.remove('active'));
                    selectedRating = 0;
                    ratingInput.value = 0;
                    ratingText.textContent = 'Click a star to rate';
                    ratingText.style.color = '#8d99ae';
                } else {
                    message.className = 'message error';
                    message.textContent = '❌ ' + (data.message || 'Something went wrong. Please try again.');
                    message.style.display = 'block';
                }
            } catch (error) {
                console.error('Error submitting testimonial:', error);
                message.className = 'message error';
                message.textContent = '❌ Could not connect to server. Please try again later.';
                message.style.display = 'block';
            }

            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Testimonial';

            // Hide message after 10 seconds
            setTimeout(() => {
                message.style.display = 'none';
            }, 10000);
        });
    </script>

</body>
</html>
